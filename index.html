<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6495ED" />
    <meta name="color-scheme" content="light" />
    <title>Easy review!</title>
    <meta name="description" content="Easy review! - 反復学習・復習管理ウェブアプリ" />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Easy review!" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="Easy review!" />
    <meta property="og:description" content="反復学習・復習管理ウェブアプリ" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Clear any service workers and browser caches so updates reflect immediately in preview
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        }).catch(() => {});
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => caches.delete(key));
        }).catch(() => {});
      }
    </script>
    <script type="module">
      const isDev = window.location.port === '3000' || window.location.hostname === 'localhost' || window.location.hostname.includes('run.app');
      if (isDev) {
        import('/src/main.tsx');
      } else {
        import(/* @vite-ignore */ './assets/index.js').catch(() => {
          import('/src/main.tsx');
        });
      }
    </script>
  </body>
</html>
