      <stop offset="0%" stop-color="#6495ED"/>
      <stop offset="100%" stop-color="#3D5FBF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
